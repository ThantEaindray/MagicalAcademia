<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Magical Academia • Profile</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Your CSS -->
  <link rel="stylesheet" href="css/color.css">
  <link rel="stylesheet" href="css/magical-theme.css">
</head>

<body>
  <!-- Navbar (same pattern as your other pages) -->
  <div id="navbarContainer"></div>

  <main class="container py-4">
    <h1 class="mb-3">Wizard Profile</h1>

    <!-- Warning -->
    <div id="warningCard" class="alert alert-danger d-none" role="alert">
      <span id="warningText">Something went wrong.</span>
    </div>

    <!-- Loading -->
    <div id="loadingBox" class="alert alert-info" role="alert">
      Summoning your profile...
    </div>

    <!-- Profile Card -->
    <div id="profileCard" class="card d-none">
      <div class="card-body">
        <h4 class="card-title mb-3">
          <span id="profileUsername">Wizard</span>
          <span class="badge text-bg-secondary ms-2" id="profileRole">Student</span>
        </h4>

        <p class="mb-1"><strong>Email:</strong> <span id="profileEmail">-</span></p>
        <p class="mb-1"><strong>Wizard ID:</strong> <span id="profileUserId">-</span></p>
        <p class="mb-3"><strong>Points:</strong> <span id="profilePoints">0</span> ✨</p>

        <div class="d-flex gap-2">
          <a class="btn btn-outline-light" href="index.html">Back to Academy</a>
          <a class="btn btn-danger" href="logout.html">Logout</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>

  <!-- Your helper scripts (BED CA2 format) -->
  <script src="js/getCurrentURL.js" defer></script>
  <script src="js/queryCmds.js" defer></script>
  <script src="js/userNavbarToggle.js" defer></script>

  <!-- Page script -->
  <script src="js/profile.js" defer></script>
</body>
</html>
