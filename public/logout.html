<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magical Academia • Logout</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/color.css">
  <link href="css/magictheme.css" rel="stylesheet">
</head>

<body>
  <div id="navbarContainer"></div>

  <main class="container py-5">
    <div class="card">
      <div class="card-body">
        <h2 class="mb-2">Leaving the Academy?</h2>
        <p class="mb-4">Your session will be cleared from this device.</p>

        <div id="warningCard" class="alert alert-danger d-none" role="alert">
          <span id="warningText">Something went wrong.</span>
        </div>

        <div class="d-flex gap-2">
          <button id="logoutBtn" class="btn btn-danger">Logout</button>
          <a href="index.html" class="btn btn-outline-light">Cancel</a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="js/getCurrentURL.js" defer></script>
  <script src="js/queryCmds.js" defer></script>
  <script src="js/userNavbarToggle.js" defer></script>
  <script src="js/logout.js" defer></script>
</body>

</html>
